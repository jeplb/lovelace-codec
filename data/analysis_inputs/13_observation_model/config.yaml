  adjacent_weight: 0.01
  imag_support:
  - 62
  - 63
  - 64
  imag_central_weight: 1.0
  imag_edge_weight: 0.01
  epsilon: 1.0e-06
  dc_real_support:
  - 31
  - 32
  dc_imag_support:
  - 32
  dc_allowed_weight: 1.0
inference:
  resolved_probability: 0.95
  tie_tolerance: 0.0
  unsupported_log_likelihood: 0.0
  tie_break: lowest_label
  scalar_read_support: all_three_cells
  scale_posterior: product_of_selected_header_cell_probabilities
  checksum_use: final_pass_fail_only
validation:
  scale_floor: 1.0e-12
  scale_margin_factor: 10.0
  image_domain: finite_float64_32_by_32_in_0_to_1
  quantizer_random_count: 100000
  quantizer_seed: 12001
  boundary_offsets:
  - 1.0e-09
  - 1.0e-12
  - 1.0e-15
  support_candidates:
  - 62
  - 63
  - 64
  real_tolerance_candidates:
  - 0
  - 1
  dc_real_candidates:
  - 31
  - 32
  dc_imag_candidates:
  - 32
  selection_rule: exclude_violations_with_scale_margin_then_keep_declared_support
execution:
