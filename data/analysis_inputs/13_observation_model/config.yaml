  - mean_sign
  - mean_exponent_msb
  - scale_sign
  proof_source: public encoder operations and independent synthetic checks
arms:
- control
- position
- position_weighted
section: 13
protocol: three_arm_incremental_observation_model
position_model:
  lambda_grid:
  - 1.0
  - 10.0
  - 100.0
  - 1000.0
  - infinity
  support:
    min_observations: 20
    min_pilot_designs: 2
    min_raw_parents: 10
  selection_objective: heldout_run_log_likelihood
  tie_order: infinity_then_larger_lambda
  global_pseudocount_per_bin: 0.5
weighting:
  candidates:
  - name: none
    suffix_prior: 0.0
    outlier_prior: 0.0
  - name: weak
    suffix_prior: 0.01
    outlier_prior: 0.01
  - name: moderate
    suffix_prior: 0.1
    outlier_prior: 0.1
  alternative_state_prior:
  - 0.25
  - 0.25
  - 0.25
  - 0.25
  boundaries_after_cells:
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
  boundary_prior: uniform_given_suffix
  reference: other_raw_parents_same_address_unweighted_distribution_once
  reference_prior: uniform_four_states
  reference_sum: ordered_parent_group_prefix_plus_suffix_excluding_scored_parent
  agreement_log_emission: logsumexp_s(log_reference_probability_s_plus_read_log_likelihood_s)
  alternative_log_emission: logsumexp_s(read_log_likelihood_s)_minus_log_four
  suffix_emission: agreement_before_boundary_alternative_from_boundary_onward
  boundary_indexing: zero_based_cells_0_through_7_boundary_b_splits_before_cell_b
  no_switch_prior: one_minus_suffix_prior_minus_outlier_prior
  model_posterior: softmax_log_prior_plus_sum_of_assessable_emissions_excluding_target_cell
  leave_cell_out: true
  min_other_parents: 2
  min_other_cells: 3
  fallback_weight: 1.0
  weight_map: posterior_no_switch_plus_boundaries_after_target
  retained_models: no_switch_and_boundary_b_with_target_j_less_than_b
  outlier_retained_weight: 0.0
  endpoint_handling: clip_float64_probability_summation_roundoff_to_zero_one
  none_candidate: exact_ones_and_unmodified_aggregation
  fallback_rule: target_has_too_few_other_parents_or_too_few_assessable_other_cells
  whole_read_outlier: alternative_at_all_assessable_cells
  suffix_diagnostic_threshold: 0.5
  diagnostic_candidate:
    name: moderate
    suffix_prior: 0.1
    outlier_prior: 0.1
  diagnostic_rule: full_read_sum_of_seven_suffix_posteriors_above_threshold_with_min_other_cells_assessable
  diagnostic_use: descriptive_only_does_not_change_selection_or_weights
  selection_objective: mean_multiclass_brier_all_fixed_heldout_cells
  tie_order:
  - none
  - weak
  - moderate
  tie_tolerance: 0.0
cross_validation:
  group: pilot_identity_parent_connected_components
  scheme: leave_one_connected_component_out
  heldout_inventory: all_eight_cells_of_each_of_24_fit_pilots
  outer_exclusion: heldout_identities_and_all_their_parents_from_model_estimation
  inner_exclusion: all_views_of_scored_parent_from_recipient_reference
  qc_excluded_from_fit: true
aggregation:
  prior: uniform_common_log_constant_omitted_for_exact_v2_parity
  base_sum_order:
  - A
  - C
  - T
  unit_order: frozen_F_clean_order
  renormalize_weights: false
  donor_reassignment: false
